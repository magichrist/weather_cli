name: PR Review Gate

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  approval:
    name: Await Maintainer Approval
    runs-on: ubuntu-latest

    environment:
      name: pr-review
      url: ${{ github.event.pull_request.html_url }}

    steps:
      - name: Approved
        run: |
          echo "Maintainer approved this PR."

  ci:
    name: Build
    needs: approval
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo Test
        run: cargo test --verbose

      - name: Cargo Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Smoke Test
        run: |
          cp target/x86_64-unknown-linux-gnu/release/weather_cli .
          RUST_LOG=trace ./weather_cli -f --ml
