[package]
name = "weather_cli"
version = "0.5.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "A weather CLI tool for current conditions and 7-day forecasts"

[dependencies]
prompts = "0.1.0"
tokio = { version = "1.47.1", features = ["full"] }
reqwest = { version = "0.12.23", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2"
colored = "3.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
clap = { version = "4.5.53", features = ["derive"] }
textplots = "0.8.7"
dirs = "6.0.0"
rattles = "0.3.1"

[profile.release]
opt-level = "z"
debug = false
lto = true
